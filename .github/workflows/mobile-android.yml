name: Mobile Android build
# Builds an installable APK of the mobile till on a GitHub runner: no Expo or Play account,
# no signing secrets. The release build is signed with the generated debug key, so it is for
# sideloading onto venue tablets for testing, not for the Play Store. Download it from the
# run's "void-pos-till-android" artifact.

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Default server address baked into the build (the till can change it when pairing)"
        required: false
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "web/src/lib/**"
      - ".github/workflows/mobile-android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_BASE: ${{ github.event.inputs.api_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build the release APK (arm64 tablets and x86_64 emulators)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: void-pos-till-android
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
