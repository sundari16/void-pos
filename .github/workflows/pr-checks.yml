name: PR checks
# Pre-merge gate on every PR to main, and on pushes to feature/fix branches so work is
# verified before a PR exists. Enforce via branch protection (require the jobs below).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: ["feature/**", "fix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: voidpos
          POSTGRES_PASSWORD: voidpos
          POSTGRES_DB: void_pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voidpos -d void_pos"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_URL: postgresql+psycopg://voidpos:voidpos@localhost:5432/void_pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install (pinned)
        run: pip install -c constraints.txt -e ".[dev,print]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy src
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          VOIDPOS_TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Migrations apply, match the models, and roll back
        env:
          VOIDPOS_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  venue-stack:
    # The self-host install as a venue runs it: build the images, start the stack, and
    # drive it end to end through the web proxy and the API.
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Write a throwaway .env
        run: |
          echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(16))')" >> .env
          echo "VOIDPOS_ADMIN_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the web till's /api proxy
        run: |
          set -a; . ./.env; set +a
          python scripts/smoke_test.py --api http://localhost:3000/api --admin-token "$VOIDPOS_ADMIN_TOKEN"
      - name: Smoke test against the API directly
        run: |
          set -a; . ./.env; set +a
          python scripts/smoke_test.py --api http://localhost:8000 --admin-token "$VOIDPOS_ADMIN_TOKEN"
      - name: The backup service wrote a dump
        run: |
          for i in $(seq 1 30); do ls backups/void_pos-*.dump >/dev/null 2>&1 && break; sleep 2; done
          ls -l backups/void_pos-*.dump
      - name: Setup CLI works in the container
        run: docker compose exec -T api void-pos list-locations
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
