name: PR checks
# Pre-merge gate on every PR to main, and on pushes to feature/fix branches so work is
# verified before a PR exists. Enforce via branch protection (require the jobs below).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: ["feature/**", "fix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Which parts of the repo a change touches, so a job can skip work it doesn't cover.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - "mobile/**"
              - "web/src/lib/**"
              - ".github/workflows/pr-checks.yml"

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: voidpos
          POSTGRES_PASSWORD: voidpos
          POSTGRES_DB: void_pos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voidpos -d void_pos"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PG_URL: postgresql+psycopg://voidpos:voidpos@localhost:5432/void_pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints.txt
      - name: Install (pinned)
        run: pip install -c constraints.txt -e ".[dev,print]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy src
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL
        run: pytest -q
        env:
          VOIDPOS_TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Migrations apply, match the models, and roll back
        env:
          VOIDPOS_DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mobile:
    # The React Native till: its copy of the shared web lib, types, lint, unit tests and
    # Expo's dependency checks. Skipped (reported as passing) when nothing it covers changed.
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Shared lib matches web/src/lib
        run: npm run check-lib
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Expo dependency checks
        run: npx expo-doctor

  venue-stack:
    # The self-host install as a venue runs it: build the images, start the stack, and
    # drive it end to end through the web proxy and the API.
    runs-on: ubuntu-24.04  # Playwright 1.51's Chromium supports up to 24.04
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Write a throwaway .env
        run: |
          echo "POSTGRES_PASSWORD=$(python -c 'import secrets; print(secrets.token_hex(16))')" >> .env
          echo "VOIDPOS_ADMIN_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> .env
          echo "VOIDPOS_AGGREGATOR_WEBHOOK_SECRET=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> .env
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Settings in .env reach the API (a set webhook secret means 403, not 503 "off")
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -H 'X-Void-Aggregator-Secret: wrong' -d '{}' http://localhost:8000/aggregators/mock/locations/x/orders)
          test "$code" = 403 || { echo "wanted 403, got $code"; exit 1; }
      - name: Smoke test through the web till's /api proxy
        run: |
          set -a; . ./.env; set +a
          python scripts/smoke_test.py --api http://localhost:3000/api
      - name: Smoke test against the API directly
        run: |
          set -a; . ./.env; set +a
          python scripts/smoke_test.py --api http://localhost:8000
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: End-to-end tests in a real browser against the stack
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          set -a; . ../.env; set +a
          E2E_BASE_URL=http://localhost:3000 E2E_API_URL=http://localhost:8000             E2E_ADMIN_TOKEN="$VOIDPOS_ADMIN_TOKEN" npx playwright test
      - name: End-to-end report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/e2e-report
            web/test-results
      - name: The backup service wrote a dump
        run: |
          for i in $(seq 1 30); do ls backups/void_pos-*.dump >/dev/null 2>&1 && break; sleep 2; done
          ls -l backups/void_pos-*.dump
      - name: Setup CLI works in the container
        run: docker compose exec -T api void-pos list-locations
      - name: Menu import from a spreadsheet, as the self-host guide shows
        run: |
          LOC=$(docker compose exec -T api void-pos list-locations | head -1 | cut -d' ' -f1)
          docker compose exec -T api void-pos import-menu --location "$LOC" --file - < docs/menu-template.csv
          docker compose exec -T api void-pos import-menu --location "$LOC" --file - < docs/menu-template.csv | grep "leave 3 unchanged"
          docker compose exec -T api void-pos import-modifiers --location "$LOC" --file - < docs/modifier-template.csv
          docker compose exec -T api void-pos import-modifiers --location "$LOC" --file - < docs/modifier-template.csv | grep "attach 0, leave 8 unchanged"
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
