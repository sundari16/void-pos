name: PR checks
# Pre-merge gate: ruff + pytest on every PR to main. Enforce via branch protection
# (Settings -> Branches -> require "PR checks / checks").

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
