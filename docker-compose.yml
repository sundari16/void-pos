# Void POS on one venue machine: PostgreSQL, the API, the web till and nightly backups.
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD and VOIDPOS_ADMIN_TOKEN
#   docker compose up -d --build
#
# Tablets open http://<this machine>:3000. See docs/self-host.md for first-time setup.
name: void-pos

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: void_pos
      POSTGRES_USER: voidpos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voidpos -d void_pos"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      VOIDPOS_DATABASE_URL: postgresql+psycopg://voidpos:${POSTGRES_PASSWORD}@db:5432/void_pos
      VOIDPOS_ADMIN_TOKEN: ${VOIDPOS_ADMIN_TOKEN:?set VOIDPOS_ADMIN_TOKEN in .env}
      VOIDPOS_CORS_ORIGINS: ${VOIDPOS_CORS_ORIGINS:-}
      VOIDPOS_KITCHEN_PRINTER_HOST: ${VOIDPOS_KITCHEN_PRINTER_HOST:-}
      VOIDPOS_KITCHEN_PRINTER_PORT: ${VOIDPOS_KITCHEN_PRINTER_PORT:-9100}
      VOIDPOS_KITCHEN_FONT_PATH: ${VOIDPOS_KITCHEN_FONT_PATH:-}
    volumes:
      - ./fonts:/fonts:ro  # optional font for non-Latin tickets, e.g. /fonts/NotoSansTamil-Regular.ttf
    ports:
      - "${API_PORT:-8000}:8000"  # admin API and setup; tablets don't need it

  web:
    build:
      context: ./web
      args:
        VOIDPOS_API_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: voidpos
      PGDATABASE: void_pos
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Australia/Brisbane}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]

volumes:
  db-data:
