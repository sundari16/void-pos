[project]
name = "void-pos"
version = "0.2.0"
description = "Open-core, software-only restaurant POS — local-first order pipeline."
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-ulid>=2.7",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",  # zoneinfo data for Windows and slim images without /usr/share/zoneinfo
    "httpx>=0.27",  # Stripe and Square calls
]

[project.scripts]
void-pos = "void_pos.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]
print = ["pillow>=10"]  # optional: rasterize non-Latin kitchen tickets

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/void_pos"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["migrations"]  # alembic-generated; verified by `alembic check`, not lint

[tool.mypy]
python_version = "3.11"
packages = ["void_pos"]
mypy_path = "src"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
